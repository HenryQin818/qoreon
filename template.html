<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目任务看板 · Qoreon</title>
  <style>
    :root {
      /* Companion system theme: calm glass + strong hierarchy (read-only) */
      --asideW: 320px;
      --bg1: #f5f7fa;
      --bg2: #c3cfe2;
      --glass: rgba(255,255,255,0.56);
      --glass2: rgba(255,255,255,0.74);
      --line: rgba(0,0,0,0.10);
      --text: rgba(0,0,0,0.86);
      --muted: rgba(0,0,0,0.58);
      --muted2: rgba(0,0,0,0.42);
      --shadow: 0 18px 50px rgba(0,0,0,0.10);
      --shadow2: 0 10px 26px rgba(0,0,0,0.08);
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;

      --good: #1f8f5f;
      --warn: #b36a00;
      --bad: #c91d3b;
      --accent: #2f6fed;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: var(--sans);
      background: transparent;
      overflow: hidden;
    }
    a { color: inherit; }
    code, pre, kbd { font-family: var(--mono); }

    /* Ambient Background (low-energy) */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      opacity: 0.9;
      will-change: transform, filter, opacity;
      box-shadow:
        inset -5vw 5vw 10vw rgba(255, 255, 255, 0.6),
        inset  5vw -5vw 10vw rgba(0, 0, 0, 0.15),
        0 10px 30px rgba(0, 0, 0, 0.05);
      -webkit-mask-image: radial-gradient(circle, black 50%, transparent 80%);
      mask-image: radial-gradient(circle, black 50%, transparent 80%);
    }
    .blob-1 { width: 40vw; height: 40vw; background: #ffdee9; }
    .blob-2 { width: 40vw; height: 40vw; background: #e0c3fc; }
    .blob-3 { width: 35vw; height: 35vw; background: #f6d365; }
    .blob-4 { width: 30vw; height: 30vw; background: #a18cd1; }
    .blob-5 { width: 25vw; height: 25vw; background: #8ec5fc; }
    .blob-6 { width: 30vw; height: 30vw; background: #b5fffc; }
    .blob-7 { width: 35vw; height: 35vw; background: #fad0c4; }
    .blob-8 { width: 25vw; height: 25vw; background: #ff9a9e; }
    @media (prefers-reduced-motion: reduce) {
      .blob {
        filter: blur(18px) !important;
        opacity: 0.6 !important;
      }
    }

    /* Layout: top project tabs + left channels + right stacked panels */
    .shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: var(--asideW) minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.42);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      box-shadow: var(--shadow2);
      min-width: 0;
    }
    .kicker {
      font-size: 11px;
      font-family: var(--mono);
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btitle {
      font-family: var(--serif);
      font-weight: 900;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bsub {
      font-size: 12px;
      color: var(--muted2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tabs {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow: auto;
      padding: 6px 2px;
      scrollbar-width: thin;
    }
    .tab {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 10px auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.55);
      cursor: pointer;
      transition: 150ms ease;
      user-select: none;
    }
    .tab:hover { transform: translateY(-1px); box-shadow: var(--shadow2); }
    .tab.active {
      border-color: rgba(47,111,237,0.28);
      background: rgba(47,111,237,0.12);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.20);
    }
    .tab .name {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.01em;
    }

    .hctrl {
      display: grid;
      grid-template-columns: 1fr 112px;
      gap: 8px;
      align-items: center;
    }
    .input, .select, .toggle {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.70);
      color: var(--text);
      padding: 10px 12px;
      outline: none;
    }
    .input::placeholder { color: rgba(0,0,0,0.35); }
    .toggle {
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 9px 10px;
    }
    .toggle input { accent-color: var(--accent); }
    .toggle span { color: var(--muted); font-size: 12px; }

    .body {
      display: grid;
      /* 3 columns: aside fixed, main/detail split 50/50 */
      grid-template-columns: var(--asideW) minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      grid-template-areas: "aside main detail";
      min-height: 0;
    }
    aside {
      grid-area: aside;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,0.34);
      backdrop-filter: blur(10px);
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }
    .asideh {
      padding: 14px 14px 10px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      align-items: start;
    }
    .asideleft {
      min-width: 0;
      display: grid;
      gap: 8px;
      align-items: start;
    }
    .pmseg {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px;
      background: rgba(255,255,255,0.56);
      box-shadow: var(--shadow2);
      width: fit-content;
    }
    .segbtn {
      border: none;
      background: transparent;
      color: rgba(0,0,0,0.62);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      transition: 140ms ease;
      line-height: 1;
      font-weight: 700;
    }
    .segbtn:hover { color: rgba(0,0,0,0.86); }
    .segbtn.active {
      background: rgba(47,111,237,0.90);
      color: #fff;
      box-shadow: 0 2px 10px rgba(47,111,237,0.35);
    }
    .asideh .at {
      margin: 0;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .asideh .am {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted2);
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-start;
    }
    body.panel-conv .asideh .am { max-width: 100%; }
    .metapill {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.66);
      color: rgba(0,0,0,0.62);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .metapill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(0,0,0,0.22);
      flex: 0 0 auto;
    }
    .metapill.good::before { background: var(--good); }
    .metapill.warn::before { background: var(--warn); }
    .metapill.bad::before { background: var(--bad); }
    .metapill.muted::before { background: rgba(0,0,0,0.22); }
    .list {
      overflow: auto;
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rowbtn {
      text-align: left;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.60);
      border-radius: 16px;
      padding: 10px 10px;
      cursor: pointer;
      transition: 140ms ease;
      display: grid;
      gap: 6px;
    }
    .rowbtn:hover { transform: translateY(-1px); box-shadow: var(--shadow2); }
    .rowbtn.active {
      border-color: rgba(47,111,237,0.28);
      background: rgba(47,111,237,0.10);
    }
    .rowbtn .rt {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .rowbtn .name {
      font-weight: 900;
      font-size: 13px;
      line-height: 1.25;
      white-space: normal;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }
    .list .rowbtn .chips {
      justify-content: flex-start;
      width: 100%;
    }
    .chip {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.55);
      color: rgba(0,0,0,0.72);
      white-space: nowrap;
    }
    .chip.good { border-color: rgba(31,143,95,0.25); background: rgba(31,143,95,0.10); }
    .chip.warn { border-color: rgba(179,106,0,0.22); background: rgba(179,106,0,0.10); }
    .chip.bad { border-color: rgba(201,29,59,0.22); background: rgba(201,29,59,0.10); }
    .chip.muted { color: rgba(0,0,0,0.50); }
    .chip.link {
      cursor: pointer;
      user-select: none;
      border-color: rgba(47,111,237,0.22);
      background: rgba(47,111,237,0.10);
      color: rgba(0,0,0,0.78);
      transition: 140ms ease;
    }
    .chip.link:hover { transform: translateY(-1px); box-shadow: var(--shadow2); }
    .chip.link:active { transform: translateY(0); }
    .rowbtn .sub {
      color: var(--muted2);
      font-size: 12px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .rowbtn .mono {
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(0,0,0,0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rowbtn .preview {
      color: rgba(0,0,0,0.62);
      font-size: 12px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stchip {
      font-family: var(--mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.72);
      color: rgba(0,0,0,0.68);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .stchip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(0,0,0,0.22);
      flex: 0 0 auto;
    }
    .stchip.good::before { background: var(--good); }
    .stchip.warn::before { background: var(--warn); }
    .stchip.bad::before { background: var(--bad); }
    .stchip.muted::before { background: rgba(0,0,0,0.22); }
    .stchip.good {
      border-color: rgba(31,143,95,0.30);
      background: rgba(31,143,95,0.13);
      color: rgba(18,87,58,0.95);
    }
    .stchip.warn {
      border-color: rgba(179,106,0,0.28);
      background: rgba(179,106,0,0.12);
      color: rgba(102,61,0,0.95);
    }
    .stchip.bad {
      border-color: rgba(201,29,59,0.28);
      background: rgba(201,29,59,0.12);
      color: rgba(120,16,34,0.95);
    }
    .stchip.muted {
      border-color: rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.72);
      color: rgba(0,0,0,0.58);
    }

    .sidefoot {
      padding: 12px 12px 14px;
      border-top: 1px solid var(--line);
      color: var(--muted2);
      font-size: 12px;
      line-height: 1.45;
    }
    .sidefoot code { color: rgba(0,0,0,0.70); }

    main {
      grid-area: main;
      min-height: 0;
      overflow: auto;
      padding: 18px 18px 32px;
    }

    /* Detail panel (no modal) */
    .detail {
      grid-area: detail;
      border-left: 1px solid var(--line);
      background: rgba(255,255,255,0.34);
      backdrop-filter: blur(10px);
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }
    .detailh {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      align-items: start;
    }
    .detailh .dk {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .detailh .dt {
      margin-top: 6px;
      font-family: var(--serif);
      font-weight: 900;
      font-size: 18px;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }
    .detailh .dsub {
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(0,0,0,0.52);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dpathbar {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 14px;
      background: rgba(255,255,255,0.62);
    }
    .dpathbar .p {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(0,0,0,0.55);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      user-select: text;
    }
    .iconbtn {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.72);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: 140ms ease;
    }
    .iconbtn:hover { transform: translateY(-1px); box-shadow: var(--shadow2); }
    .iconbtn:active { transform: translateY(0); }
    .iconbtn svg { width: 18px; height: 18px; opacity: 0.72; }
    .detailb {
      padding: 12px 14px 18px;
      overflow: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .detailb > * {
      flex: 0 0 auto;
      min-height: 0;
    }
    .detailb .hint {
      color: var(--muted2);
      font-size: 12px;
      line-height: 1.5;
    }
    #detailExcerpt {
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }
    /* Panel mode: project conversations */
    body.panel-conv .body {
      grid-template-columns: clamp(320px, 24vw, 420px) minmax(0, 1fr);
      grid-template-areas: "aside detail";
    }
    body.panel-conv aside {
      grid-template-rows: auto minmax(0, 1fr);
    }
    body.panel-conv main { display: none; }
    body.panel-conv .detail {
      border-left: 1px solid var(--line);
      border-top: none;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    body.panel-conv .asideleft {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    body.panel-conv #asideTitle { display: none; }
    body.panel-conv .asideh {
      padding: 10px 12px 8px;
      gap: 6px;
    }
    body.panel-conv .asideh .am {
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      gap: 6px;
      scrollbar-width: thin;
    }
    body.panel-conv .asideh .am::-webkit-scrollbar { height: 4px; }
    body.panel-conv .metapill { padding: 2px 7px; }
    body.panel-conv .sidefoot { display: none; }
    body.panel-conv .detailh {
      padding: 10px 12px 8px;
    }
    body.panel-conv .detailh .dk { display: none; }
    body.panel-conv .detailh > div {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      scrollbar-width: thin;
    }
    body.panel-conv .detailh > div::-webkit-scrollbar { height: 4px; }
    body.panel-conv .detailh .dt {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      min-width: max-content;
      flex: 0 0 auto;
    }
    body.panel-conv .detailh .dsub {
      margin: 0;
      font-size: 11px;
      max-width: 52%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 1 auto;
    }
    body.panel-conv .detailh .dsub { display: none; }
    body.panel-conv .detailh .dpathbar { display: none !important; }
    body.panel-conv #detailMeta,
    body.panel-conv #detailExcerpt,
    body.panel-conv #detailMore,
    body.panel-conv #ccbBox { display: none !important; }
    body.panel-conv .detailb { overflow: hidden; }
    body.panel-conv .detailb > .convwrap { flex: 1 1 auto; }

    .convwrap {
      display: none;
      min-height: 0;
      height: 100%;
      padding: 10px 12px 12px;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 10px;
    }
    .convwrap.show { display: grid; }
    .convtimeline {
      min-height: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,0.42);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msgrow {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 92%;
    }
    .msgrow.user { align-self: flex-end; }
    .msgrow.assistant { align-self: flex-start; }
    .mbubble {
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.82);
      padding: 9px 10px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: var(--shadow2);
    }
    .msgrow.user .mbubble {
      border-color: rgba(47,111,237,0.28);
      background: rgba(47,111,237,0.12);
    }
    .mbubble.collapsed {
      max-height: 168px;
      overflow: hidden;
      position: relative;
    }
    .mbubble.collapsed::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 44px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0.94));
    }
    .msgrow.user .mbubble.collapsed::after {
      background: linear-gradient(to bottom, rgba(47,111,237,0), rgba(235,242,255,0.96));
    }
    .bubbleops {
      display: flex;
      margin-top: 2px;
    }
    .bubbleops.user { justify-content: flex-end; }
    .bubbleops.assistant { justify-content: flex-start; }
    .bubbleops .user-bubble-expand-toggle {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(47,111,237,0.16);
      background: rgba(255,255,255,0.78);
      color: #2456b8;
      font-weight: 600;
    }
    .bubbleops .user-bubble-expand-toggle:hover {
      background: rgba(255,255,255,0.96);
      color: #1d4ed8;
      text-decoration: none;
    }
    .msgmeta {
      display: flex;
      gap: 6px;
      align-items: center;
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(0,0,0,0.48);
    }
    .msgrow.user .msgmeta {
      justify-content: flex-end;
      align-self: flex-end;
      text-align: right;
    }

    .meta {

    .btn {

    /* Filter bar (image-2 style): chips + list (no board grouping) */

    .filelist {

    .frow {

    }
    .frow .t {

    /* Layout overrides: force-right/force-bottom must work on ALL widths */
    body.force-bottom .body {
      grid-template-columns: var(--asideW) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 360px;
      grid-template-areas: "aside main" "detail detail";
    }
    body.force-bottom .detail {
      border-left: none;
      border-top: 1px solid var(--line);
    }
    body.force-right .body {
      grid-template-columns: var(--asideW) minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      grid-template-areas: "aside main detail";
    }
    body.force-right .detail {
      border-top: none;
      border-left: 1px solid var(--line);
    }

    /* Compact helpers (avoid bottom-right debug blocks taking over) */
    .quickrow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      border: 1px solid rgba(0,0,0,0.08);

    }
    .quickrow .k {

    }
    .quickrow .v {

      min-width: 0;
      font-family: var(--mono);
      font-size: 11px;
      color: rgba(0,0,0,0.55);

      overflow: hidden;

    }

    details.group {

    .gname {
      font-family: var(--mono);

      letter-spacing: 0.08em;

      color: rgba(0,0,0,0.70);

    .gcnt {
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(0,0,0,0.50);
    }

    .items {
      padding: 10px 10px 12px;

      flex-direction: column;

    }
    .item {
      border: 1px solid rgba(0,0,0,0.08);

    /* Modal: item preview */
    .modal {

      inset: 0;

      align-items: center;

      padding: 24px;
      z-index: 10;

    .modalbox {

      max-height: 86vh;
      overflow: hidden;
      border-radius: 18px;

      background: rgba(255,255,255,0.90);

    .modalh {
      padding: 14px 14px 12px;

      justify-content: space-between;

    pre {
      margin: 0;
      white-space: pre-wrap;
      font-family: var(--mono);

    .md > *:last-child { margin-bottom: 0; }

    .md p { margin: 0 0 8px; }
    .mdview h1, .mdview h2, .mdview h3, .mdview h4, .mdview h5, .mdview h6,
    .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {

    /* CCB (send msg + show reply) */
    .ccb {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.46);
      box-shadow: var(--shadow2);
      overflow: hidden;
    }
    .ccbh {
      padding: 10px 12px 9px;
      border-bottom: 1px solid var(--line);

      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    .ccbh .t {
      font-family: var(--mono);
      font-size: 12px;

      color: rgba(0,0,0,0.70);
      margin: 0;
    }
    .ccbb { padding: 10px 12px 12px; display: grid; gap: 10px; }

    textarea.msg {

      line-height: 1.45;
      outline: none;
    }
    .runs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .runrow {
      border: 1px solid rgba(0,0,0,0.10);
      background: rgba(255,255,255,0.70);
      border-radius: 14px;
      padding: 10px 10px;
      display: grid;
      gap: 8px;

    .runrow .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;

      font-family: var(--mono);
      font-size: 11px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .runrow .msg {
      font-size: 12px;
      color: rgba(0,0,0,0.80);

    .runrow .err {

      padding: 8px 9px;

      background: rgba(47,111,237,0.10);

    @media (max-width: 1060px) {
      header { grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: auto auto; }
      .hctrl { grid-column: 1 / -1; grid-template-columns: 1fr 112px; }
      /* Auto: portrait-ish -> detail goes bottom (2 panels on top + detail below) */
      body:not(.force-right) .body {
        grid-template-columns: 280px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) 360px;
        grid-template-areas: "aside main" "detail detail";
      }
      body:not(.force-right) .detail {
        border-left: none;
        border-top: 1px solid var(--line);
      }
      body.force-bottom .body {
        grid-template-columns: 280px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) 360px;
        grid-template-areas: "aside main" "detail detail";
      }
      body.force-bottom .detail {
        border-left: none;
        border-top: 1px solid var(--line);
      }
      body.force-right .body {
        grid-template-columns: 280px minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        grid-template-areas: "aside main detail";
      }
    }
    @media (max-width: 760px) {
      header { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
      .hctrl { grid-template-columns: 1fr 112px; }
      .body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 1fr) 360px;
        grid-template-areas: "main" "detail";
      }
      aside { display: none; }
      body.panel-conv .body {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(220px, 36vh) minmax(0, 1fr);

  <script>

    })();

    const DONE_STATUSES = new Set(["已完成", "已验收通过", "已消费", "已解决", "已关闭", "已停止"]);
    const PAUSE_STATUSES = new Set(["已暂停", "暂缓"]);
    const STATUS_ORDER = ["督办", "进行中", "待开始", "待处理", "待验收", "待消费", "其他", "已暂停", "已完成"];
    const CHANNEL_RENAME_MAP_BY_PROJECT = {
      qoreon_v2: {
        "子级01-Go后端平台（API-索引-服务控制面）": "研发01-Go后端平台（API-索引-服务控制面）",
        "子级02-CCB与多CLI运行时（Legacy Connector-队列-CLI适配）": "研发02-CCB与多CLI运行时（Legacy Connector-队列-CLI适配）",
        "子级03-Vue前端工作台（平台首页-Agent控制台-项目工作台）": "研发03-前端工作台（平台首页-Agent控制台-项目工作台）",
        "子级03-前端工作台（平台首页-Agent控制台-项目工作台）": "研发03-前端工作台（平台首页-Agent控制台-项目工作台）",
        "子级04-数据与知识治理（对象映射-迁移-知识沉淀）": "研发04-数据与知识治理（对象映射-迁移-知识沉淀）",
        "子级05-测试与验收（性能-功能-迁移-回归）": "测试01-测试与验收（性能-功能-迁移-回归）",
        "辅助04-产品与原型（IA-原型-业务规格）": "产品00-产品原型总控（IA-业务规格-原型门禁）",
        "辅助04-原型设计与Demo可视化（静态数据填充-业务规格确认）": "产品00-产品原型总控（IA-业务规格-原型门禁）",
        "辅助06-运维与远程访问（部署-健康-安全-远程访问）": "运维01-运维与远程访问（部署-健康-安全-远程访问）",
        "辅助06-项目运维（运行巡检-异常告警-会话修复）": "运维01-运维与远程访问（部署-健康-安全-远程访问）",
      },
    };

    function isQoreonV2Project(projectId) {
      return String(projectId || "").trim() === "qoreon_v2";
    }

    function canonicalChannelName(projectId, channelName) {
      const raw = String(channelName || "").trim();
      if (!raw) return "";
      const map = CHANNEL_RENAME_MAP_BY_PROJECT[String(projectId || "").trim()];
      return (map && map[raw]) ? map[raw] : raw;
    }

    function currentChannelNameSet(projectId) {
      const set = new Set();
      const proj = projectById(projectId);
      const add = (name) => {
        const ch = canonicalChannelName(projectId, name);
        if (ch) set.add(ch);
      };
      if (proj && Array.isArray(proj.channels)) for (const c of proj.channels) if (c && c.name) add(c.name);
      if (proj && Array.isArray(proj.channel_sessions)) for (const cs of proj.channel_sessions) if (cs && cs.name) add(cs.name);
      return set;
    }

    const STATE = {
      project: ((DATA.projects && DATA.projects.length) ? String(DATA.projects[0].id || "") : ""), // <project_id>
      channel: "",           // per project
      q: "",
      type: "全部",
      status: "待办",        // 待办 | 进行中 | 已完成 | 全部
      view: "work",          // work | comms
      panelMode: "ops",      // ops | conv
      layout: "auto",        // auto | right | bottom
      selectedPath: "",
      selectedSessionId: "",
    };

    function el(tag, attrs = {}, children = []) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") n.className = v;
        else if (k === "text") n.textContent = v;
        else if (k === "html") n.innerHTML = v;
        else if (k === "style") n.setAttribute("style", v);
        else n.setAttribute(k, v);
      }
      for (const c of children) n.appendChild(c);
      return n;
    }

    function copyText(s) {
      navigator.clipboard?.writeText(String(s)).catch(() => {});
    }

    function isHttpUrl(u) {
      return /^https?:\/\//i.test(String(u || ""));
    }

    function openNew(u) {
      try { window.open(String(u), "_blank", "noopener,noreferrer"); } catch (_) {}
    }

    function shortTitle(t) {
      return String(t || "").replace(/^【[^】]+】\s*/, "");
    }

    function shortId(s) {
      const t = String(s || "");
      if (t.length <= 18) return t;
      return t.slice(0, 8) + "…" + t.slice(-4);
    }

    function shortDateTime(ts) {
      const t = String(ts || "").trim();
      if (!t) return "";
      return t.replace("T", " ").replace(/\.\d+/, "").slice(0, 19);
    }

    function parseDateTime(ts) {
      const raw = String(ts || "").trim();
      if (!raw) return null;
      let s = raw;
      // Normalize timezone like +0800 -> +08:00 for safer parsing.
      if (/[\+\-]\d{4}$/.test(s)) s = s.replace(/([\+\-]\d{2})(\d{2})$/, "$1:$2");
      const d = new Date(s);
      if (!Number.isNaN(d.getTime())) return d;
      const d2 = new Date(raw.replace(" ", "T"));
      if (!Number.isNaN(d2.getTime())) return d2;
      return null;
    }

    function imTime(ts) {
      const d = parseDateTime(ts);
      if (!d) return String(ts || "");
      const now = new Date();
      const pad2 = (n) => String(n).padStart(2, "0");
      const hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());

      const sameDay = d.getFullYear() === now.getFullYear()
        && d.getMonth() === now.getMonth()
        && d.getDate() === now.getDate();
      if (sameDay) return hm;

      const y = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diffDays = Math.round((y - x) / 86400000);
      if (diffDays === 1) return "昨天 " + hm;
      if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
      return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
    }

    function toTimeNum(ts) {
      const d = parseDateTime(ts);
      return d ? d.getTime() : -1;
    }

    function compactDateTime(ts) {
      const t = shortDateTime(ts);
      if (!t) return "";
      const m = t.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
      if (!m) return t;
      return m[2] + "-" + m[3] + " " + m[4] + ":" + m[5];
    }

    function escapeHtml(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function mdInline(raw) {
      let s = escapeHtml(raw || "");
      const stash = [];
      const stashPush = (html) => {
        stash.push(String(html || ""));
        return "\u0000" + (stash.length - 1) + "\u0000";
      };
      s = s.replace(/`([^`]+)`/g, (_, code) => {
        return stashPush("<code>" + code + "</code>");
      });
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => {
        const u = String(url || "").trim();
        if (!/^https?:\/\//i.test(u)) return text;
        return stashPush('<a href="' + escapeHtml(u) + '" target="_blank" rel="noopener noreferrer">' + text + "</a>");
      });
      s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, (_, pre, url) => {
        return pre + stashPush('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + url + "</a>");
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
      s = s.replace(/(^|[^\*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      s = s.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
      s = s.replace(/\u0000(\d+)\u0000/g, (_, idx) => stash[Number(idx)] || "");
      return s;
    }

    function markdownToHtml(input) {
      const src = String(input || "").replace(/\r\n?/g, "\n");
      if (!src.trim()) return "";
      const lines = src.split("\n");
      const out = [];
      let paragraph = [];
      let listType = "";
      let listItems = [];
      let inCode = false;
      let codeLines = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        const text = paragraph.join("\n").trim();
        paragraph = [];
        if (!text) return;
        out.push("<p>" + mdInline(text).replace(/\n/g, "<br>") + "</p>");
      }
      function flushList() {
        if (!listItems.length || !listType) return;
        out.push("<" + listType + ">" + listItems.map((x) => "<li>" + mdInline(x) + "</li>").join("") + "</" + listType + ">");
        listType = "";
        listItems = [];
      }
      function flushNormal() {
        flushParagraph();
        flushList();
      }

      for (const ln of lines) {
        const line = String(ln || "");
        if (inCode) {
          if (/^```/.test(line.trim())) {
            out.push('<pre class="md-code"><code>' + escapeHtml(codeLines.join("\n")) + "</code></pre>");
            inCode = false;
            codeLines = [];
          } else {
            codeLines.push(line);
          }
          continue;
        }

        if (/^```/.test(line.trim())) {
          flushNormal();
          inCode = true;
          codeLines = [];
          continue;
        }

        const t = line.trim();
        if (!t) {
          flushNormal();
          continue;
        }

        let m = t.match(/^(#{1,6})\s+(.*)$/);
        if (m) {
          flushNormal();
          const lv = Math.min(6, Math.max(1, m[1].length));
          out.push("<h" + lv + ">" + mdInline(m[2]) + "</h" + lv + ">");
          continue;
        }

        m = t.match(/^[-*+]\s+(.*)$/);
        if (m) {
          flushParagraph();
          if (listType && listType !== "ul") flushList();
          listType = "ul";
          listItems.push(m[1]);
          continue;
        }

        m = t.match(/^\d+\.\s+(.*)$/);
        if (m) {
          flushParagraph();
          if (listType && listType !== "ol") flushList();
          listType = "ol";
          listItems.push(m[1]);
          continue;
        }

        m = t.match(/^>\s?(.*)$/);
        if (m) {
          flushNormal();
          out.push("<blockquote>" + mdInline(m[1]) + "</blockquote>");
          continue;
        }

        if (listItems.length) flushList();
        paragraph.push(line);
      }

      flushNormal();
      if (inCode) out.push('<pre class="md-code"><code>' + escapeHtml(codeLines.join("\n")) + "</code></pre>");
      return out.join("");
    }

    function setMarkdown(elNode, text, fallback = "") {
      if (!elNode) return;
      const src = String(text || "").trim() ? String(text || "") : String(fallback || "");
      elNode.innerHTML = markdownToHtml(src);
    }

    function conversationPreviewLine(s) {
      const text = String((s && s.lastPreview) || "").trim();
      const speaker = String((s && s.lastSpeaker) || "assistant");
      if (!text) return "系统: 暂无消息";
      return (speaker === "user" ? "我: " : "Codex: ") + text;
    }

    function looksLikeSessionId(s) {
      return /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/.test(String(s || "").trim());
    }

    // Local session bindings (per project+channel) stored in localStorage.
    // Purpose: allow quick binding from UI without editing config.toml.
    const BINDINGS_KEY = "taskDashboard.sessionBindings.v1";
    function loadBindings() {
      try {
        const raw = localStorage.getItem(BINDINGS_KEY);
        const j = raw ? JSON.parse(raw) : {};
        return (j && typeof j === "object") ? j : {};
      } catch (_) { return {}; }
    }
    function saveBindings(obj) {
      try { localStorage.setItem(BINDINGS_KEY, JSON.stringify(obj || {})); } catch (_) {}
    }
    function getBinding(projectId, channelName) {
      const pid = String(projectId || "");
      const ch = String(channelName || "");
      if (!pid || !ch) return null;
      const all = loadBindings();
      const hit = all && all[pid] ? all[pid][ch] : null;
      if (!hit) return null;
      const sid = String(hit.session_id || hit.sessionId || "").trim();
      if (!looksLikeSessionId(sid)) return null;
      return { session_id: sid, updated_at: String(hit.updated_at || "") };
    }
    function setBinding(projectId, channelName, sessionId) {
      const pid = String(projectId || "");
      const ch = String(channelName || "");
      const sid = String(sessionId || "").trim();
      if (!pid || !ch || !looksLikeSessionId(sid)) return false;
      const all = loadBindings();
      if (!all[pid]) all[pid] = {};
      all[pid][ch] = { session_id: sid, updated_at: new Date().toISOString() };
      saveBindings(all);
      return true;
    }
    function clearBinding(projectId, channelName) {
      const pid = String(projectId || "");
      const ch = String(channelName || "");
      const all = loadBindings();
      if (all && all[pid] && all[pid][ch]) {
        delete all[pid][ch];
        saveBindings(all);
        return true;
      }
      return false;
    }

    const BIND_UI = { open: false, projectId: "", channelName: "" };
    function bindModalError(msg) {
      const err = document.getElementById("bindErr");
      if (!err) return;
      const m = String(msg || "").trim();
      err.textContent = m;
      err.style.display = m ? "" : "none";
    }
    function openBindModal(projectId, channelName) {
      const pid = String(projectId || "");
      const ch = String(channelName || "");
      if (!pid || !ch || pid === "overview") return;
      BIND_UI.open = true;
      BIND_UI.projectId = pid;
      BIND_UI.channelName = ch;
      bindModalError("");
      const sub = document.getElementById("bindSub");
      const sidIn = document.getElementById("bindSid");
      const mask = document.getElementById("bindMask");
      if (sub) sub.textContent = `项目: ${pid} · 通道: ${ch}`;
      if (sidIn) {
        const cur = getBinding(pid, ch);
        sidIn.value = cur ? String(cur.session_id || "") : "";
        setTimeout(() => { try { sidIn.focus(); } catch (_) {} }, 10);
      }
      if (mask) mask.classList.add("show");
    }
    function closeBindModal() {
      BIND_UI.open = false;
      const mask = document.getElementById("bindMask");
      if (mask) mask.classList.remove("show");
    }

    function bucketKeyForStatus(status) {
      const s = String(status || "");
      if (s.includes("督办")) return "督办";
      if (s.includes("进行中")) return "进行中";
      if (s.includes("待开始")) return "待开始";
      if (s.includes("待处理")) return "待处理";
      if (s.includes("待验收")) return "待验收";
      if (s.includes("待消费")) return "待消费";
      if (DONE_STATUSES.has(s)) return "已完成";
      if (PAUSE_STATUSES.has(s)) return "已暂停";
      return "其他";
    }

    function toneForBucket(bucket) {
      if (bucket === "督办") return "bad";
      if (bucket === "进行中") return "warn";
      if (bucket === "待处理") return "warn";
      if (bucket === "待验收") return "warn";
      if (bucket === "待消费") return "warn";
      if (bucket === "已完成") return "good";
      return "muted";
    }

    function chip(text, cls = "") {
      return el("span", { class: "chip " + (cls || ""), text });
    }

    function metaPill(text, tone = "muted") {
      return el("span", { class: "metapill " + (tone || "muted"), text: String(text || "") });
    }

    function statusLabel(st) {
      const s = String(st || "").toLowerCase();
      if (s === "done") return "完成";
      if (s === "running") return "处理中";
      if (s === "queued") return "排队";
      if (s === "error") return "异常";
      return "空闲";
    }

    function statusTone(st) {
      const s = String(st || "").toLowerCase();
      if (s === "done") return "good";
      if (s === "running" || s === "queued") return "warn";
      if (s === "error") return "bad";
      return "muted";
    }

    function statusChip(st) {
      return el("span", { class: "stchip " + statusTone(st), text: statusLabel(st) });
    }

    function chipLink(label, url) {
      const u = String(url || "");
      const b = el("button", { class: "chip link", text: String(label || "链接"), title: u || "" });
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        if (isHttpUrl(u)) openNew(u);
        else if (u) copyText(u);
      });
      return b;
    }

    function pages() {
      const out = [];
      for (const p of (DATA.projects || [])) out.push({ id: p.id, name: p.name, color: p.color || "#2f6fed" });
      return out;
    }

    function projectById(id) {
      return (DATA.projects || []).find(x => x.id === id) || null;
    }

    function allItems() {
      return DATA.items || [];
    }

    function itemsForProject(projectId) {
      if (projectId === "overview") return allItems();
      return allItems().filter(x => x.project_id === projectId);
    }

    function isDiscussionSpaceItem(it) {
      const p = String((it && it.path) || "");
      if (p.includes("/讨论空间/")) return true;
      return String((it && it.type) || "") === "讨论";
    }

    function matchesQuery(it) {
      const q = String(STATE.q || "").trim().toLowerCase();
      if (!q) return true;
      const hay = (String(it.title || "") + " " + String(it.code || "") + " " + String(it.owner || "") + " " + String(it.path || "")).toLowerCase();
      return hay.includes(q);
    }

    function matchesStatus(it, statusFilter) {
      const f = String(statusFilter || "待办");
      if (f === "全部") return true;
      const b = bucketKeyForStatus(it.status);
      // 图二语义：进行中通常包含“督办”这类更高优先级子集
      if (f === "进行中") return (b === "进行中" || b === "督办");
      if (f === "已完成") return b === "已完成";
      // 待办：所有未完成（含进行中/督办），但排除暂停
      if (f === "待办") return !(b === "已完成" || b === "已暂停");
      return true;
    }

    // Content filters (type/status/search) apply ONLY to the main list/detail, not to the left "channel directory" layer.
    function filteredItemsForProject(projectId) {
      let items = itemsForProject(projectId);
      items = items.filter(matchesQuery);
      if (STATE.type && STATE.type !== "全部") items = items.filter(x => x.type === STATE.type);
      items = items.filter(x => matchesStatus(x, STATE.status));
      return items;
    }

    function unionChannelNames(projectId) {
      const s = currentChannelNameSet(projectId);
      const filterHistorical = isQoreonV2Project(projectId);
      for (const it of itemsForProject(projectId)) {
        if (!it || !it.channel) continue;
        const ch = canonicalChannelName(projectId, it.channel);
        if (!ch) continue;
        if (filterHistorical && s.size && !s.has(ch)) continue;
        s.add(ch);
      }
      return Array.from(s).sort((a,b) => a.localeCompare(b, "zh-Hans-CN"));
    }

    function sessionForChannel(projectId, channelName) {
      const proj = projectById(projectId);
      if (!proj) return null;
      const local = getBinding(projectId, channelName);
      const list = Array.isArray(proj.channel_sessions) ? proj.channel_sessions : [];
      const hit = list.find(x => String(x.name || "") === String(channelName));
      if (hit) {
        if (local && local.session_id) return { ...hit, session_id: local.session_id, source: "local" };
        return hit;
      }
      const cfg = Array.isArray(proj.channels) ? proj.channels : [];
      const hit2 = cfg.find(x => String(x.name || "") === String(channelName));
      if (hit2) {
        const base = { name: hit2.name, alias: hit2.alias || "", session_id: hit2.session_id || "", desc: hit2.desc || "", source: "config" };
        if (local && local.session_id) return { ...base, session_id: local.session_id, source: "local" };
        return base;
      }
      const base = { name: channelName, alias: "", session_id: "", desc: "", source: "" };
      if (local && local.session_id) return { ...base, session_id: local.session_id, source: "local" };
      return base;
    }

    function defaultChannelForProject(projectId) {
      const names = unionChannelNames(projectId);
      if (!names.length) return "";
      // Default channel selection must be stable and must not change due to content filters.
      const items = itemsForProject(projectId);
      const byChan = new Map();
      for (const n of names) byChan.set(n, []);
      for (const it of items) {
        const k = String(it.channel || "");
        if (!byChan.has(k)) byChan.set(k, []);
        byChan.get(k).push(it);
      }
      function score(list) {
        let s = 0;
        for (const it of list) {
          const b = bucketKeyForStatus(it.status);
          if (b === "督办") s += 1000;
          else if (b === "进行中") s += 300;
          else if (b === "待验收" || b === "待消费" || b === "待处理" || b === "待开始") s += 120;
          else if (b === "其他") s += 20;
          else if (b === "已暂停") s += 5;
          else if (b === "已完成") s += 1;
        }
        return s;
      }
      let best = names[0];
      let bestScore = -1;
      for (const n of names) {
        const sc = score(byChan.get(n) || []);
        if (sc > bestScore) { bestScore = sc; best = n; }
      }
      return best;
    }

    function ensureChannel() {
      if (STATE.project === "overview") { STATE.channel = ""; return; }
      const names = unionChannelNames(STATE.project);
      if (!names.length) { STATE.channel = ""; return; }
      if (!STATE.channel || !names.includes(STATE.channel)) STATE.channel = defaultChannelForProject(STATE.project);
    }

    function buildTabs() {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = "";

      const overview = el("button", { class: "tab", title: "进入项目总揽页" });
      overview.appendChild(el("span", { class: "dot", style: "background:#2f6fed" }));
      overview.appendChild(el("span", { class: "name", text: "总揽" }));
      overview.addEventListener("click", () => { location.href = OVERVIEW_PAGE; });
      tabs.appendChild(overview);

      for (const p of pages()) {
        const b = el("button", { class: "tab" + (STATE.project === p.id ? " active" : "") });
        b.appendChild(el("span", { class: "dot", style: "background:" + (p.color || "#2f6fed") }));
        b.appendChild(el("span", { class: "name", text: p.name }));
        b.addEventListener("click", () => {
          STATE.project = p.id;
          ensureChannel();
          STATE.selectedPath = "";
          setHash();
          render();
        });
        tabs.appendChild(b);
      }
    }

    function countByBucket(items) {
      const m = new Map();
      for (const it of items) {
        const k = bucketKeyForStatus(it.status);
        m.set(k, (m.get(k) || 0) + 1);
      }
      return m;
    }

    function buildLeftList() {
      const left = document.getElementById("leftList");
      const asideTitle = document.getElementById("asideTitle");
      const asideMeta = document.getElementById("asideMeta");
      left.innerHTML = "";

      if (STATE.panelMode === "conv") {
        buildConversationLeftList();
        return;
      }

      if (STATE.project === "overview") {
        asideTitle.textContent = "项目";
        // Left is a "parent layer": do NOT change its spec/counters due to main content filters.
        asideMeta.innerHTML = "";
        asideMeta.appendChild(metaPill("项目 " + (pages().length - 1), "muted"));
        asideMeta.appendChild(metaPill("事项 " + allItems().length, "good"));
        for (const p of pages().filter(x => x.id !== "overview")) {
          const itsAll = itemsForProject(p.id);
          const active = itsAll.filter(x => !DONE_STATUSES.has(x.status) && !PAUSE_STATUSES.has(x.status)).length;
          const done = itemsForProject(p.id).filter(x => DONE_STATUSES.has(x.status)).length;
          const btn = el("button", { class: "rowbtn" });
          btn.appendChild(el("div", { class: "name", text: p.name }));
          const chips = el("div", { class: "chips" });
          chips.appendChild(chip("活跃:" + active, active ? "warn" : "muted"));
          chips.appendChild(chip("已完成:" + done, done ? "good" : "muted"));
          btn.appendChild(chips);
          btn.addEventListener("click", () => {
            STATE.project = p.id;
            ensureChannel();
            STATE.selectedPath = "";
            setHash();
            render();
          });
          left.appendChild(btn);
        }
        return;
      }

      asideTitle.textContent = "通道";
      const total = itemsForProject(STATE.project).length;
      asideMeta.innerHTML = "";
      asideMeta.appendChild(metaPill("通道 " + unionChannelNames(STATE.project).length, "muted"));
      asideMeta.appendChild(metaPill("事项 " + total, "good"));

      const names = unionChannelNames(STATE.project);
      for (const name of names) {
        // Stable channel directory layer: counts are based on full data, not content filters.
        const its = itemsForProject(STATE.project).filter(x => String(x.channel || "") === String(name));
        const buckets = countByBucket(its);
        const active = its.filter(x => !DONE_STATUSES.has(x.status) && !PAUSE_STATUSES.has(x.status)).length;
        const sess = sessionForChannel(STATE.project, name);
        const hasSession = !!(sess && sess.session_id && String(sess.session_id).trim());
        const btn = el("button", { class: "rowbtn" + (STATE.channel === name ? " active" : "") });
        btn.appendChild(el("div", { class: "name", text: name }));
        const chips = el("div", { class: "chips" });
        const d = buckets.get("督办") || 0;
        const ing = buckets.get("进行中") || 0;
        if (d) chips.appendChild(chip("督办:" + d, "bad"));
        if (ing) chips.appendChild(chip("进行中:" + ing, "warn"));
        chips.appendChild(chip("活跃:" + active, active ? "warn" : "muted"));
        chips.appendChild(chip(hasSession ? "session:已配" : "session:未配", hasSession ? "good" : "muted"));
        btn.appendChild(chips);
        // Keep left list compact: session status already in chips; avoid long commands here.
        btn.addEventListener("click", () => {
          STATE.channel = name;
          STATE.selectedPath = "";
          setHash();
          render();
        });
        left.appendChild(btn);
      }
    }

    function panel(title, rightNode, bodyNodes) {
      const p = el("section", { class: "panel" });
      const h = el("div", { class: "ph" });
      h.appendChild(el("h2", { text: title }));
      if (rightNode) h.appendChild(rightNode);
      p.appendChild(h);
      const b = el("div", { class: "pb" });
      for (const n of (bodyNodes || [])) b.appendChild(n);
      p.appendChild(b);
      return p;
    }

    function kvRow(k, v, btnText, btnAction, primary) {
      const wrap = el("div", { class: "rowbtn", style: "cursor:default" });
      const rt = el("div", { class: "rt" });
      rt.appendChild(el("div", { class: "name", text: String(k || "") }));
      if (btnText) {
        const b = el("button", { class: "btn" + (primary ? " primary" : ""), text: btnText });
        b.addEventListener("click", (e) => { e.stopPropagation(); btnAction && btnAction(); });
        rt.appendChild(b);
      }
      wrap.appendChild(rt);
      if (v) wrap.appendChild(el("div", { class: "mono", text: String(v) }));
      return wrap;
    }

    function isItemVisible(it) {
      if (!it || !it.path) return false;
      const p = String(it.path);
      return scopeItems().some(x => String(x.path) === p);
    }

    function selectedItem() {
      if (!STATE.selectedPath) return null;
      const p = String(STATE.selectedPath);
      return allItems().find(x => String(x.path) === p) || null;
    }

    function chooseDefaultItem() {
      if (STATE.project === "overview") {
        const all = filteredItemsForProject("overview");
        all.sort((a,b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
        return all[0] || null;
      }
      if (STATE.view === "comms") {
        const base = itemsForProject(STATE.project).filter(x => String(x.channel || "") === String(STATE.channel));
        const comms = base.filter(isDiscussionSpaceItem).filter(matchesQuery);
        comms.sort((a,b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
        return comms[0] || null;
      }
      const base = filteredItemsForProject(STATE.project).filter(x => String(x.channel || "") === String(STATE.channel));
      base.sort((a,b) => {
        const oa = STATUS_ORDER.indexOf(bucketKeyForStatus(a.status));
        const ob = STATUS_ORDER.indexOf(bucketKeyForStatus(b.status));
        if (oa !== ob) return oa - ob;
        return String(b.updated_at || "").localeCompare(String(a.updated_at || ""));
      });
      return base[0] || null;
    }

    function ensureSelection() {
      if (STATE.panelMode === "conv") return;
      const cur = selectedItem();
      if (cur && isItemVisible(cur)) return;
      const d = chooseDefaultItem();
      if (d) STATE.selectedPath = String(d.path);
    }

    function setSelectedPath(p) {
      if (STATE.panelMode === "conv") return;
      STATE.selectedPath = String(p || "");
      try { localStorage.setItem("taskDashboard.selectedPath", STATE.selectedPath); } catch (_) {}
      renderDetail(selectedItem());
      refreshCCB();
      updateSelectionUI();
    }

    function updateSelectionUI() {
      const p = String(STATE.selectedPath || "");
      for (const n of document.querySelectorAll("[data-path]")) {
        if ((n.getAttribute("data-path") || "") === p) n.classList.add("active");
        else n.classList.remove("active");
      }
    }

    function chipButton(label, active, onClick) {
      const b = el("button", { class: "chipbtn" + (active ? " active" : ""), text: label });
      b.addEventListener("click", onClick);
      return b;
    }

    function typeOptions() {
      const preferred = ["任务", "问题", "反馈", "答复", "讨论"];
      const types = Array.from(new Set(allItems().map(x => String(x.type || "")).filter(Boolean)));
      const extra = types.filter(t => !preferred.includes(t)).sort((a,b) => a.localeCompare(b, "zh-Hans-CN"));
      return ["全部", ...preferred.filter(t => types.includes(t)), ...extra];
    }

    function statusOptions() {
      // 对齐图二：少而好用
      return ["待办", "进行中", "已完成", "全部"];
    }

    function scopeItems() {
      if (STATE.view === "comms") {
        if (STATE.project === "overview") return [];
        if (!STATE.channel) return [];
        const base = itemsForProject(STATE.project).filter(x => String(x.channel || "") === String(STATE.channel));
        const comms = base.filter(isDiscussionSpaceItem).filter(matchesQuery);
        comms.sort((a,b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
        return comms;
      }
      if (STATE.project === "overview") return filteredItemsForProject("overview");
      if (!STATE.channel) return [];
      return filteredItemsForProject(STATE.project).filter(x => String(x.channel || "") === String(STATE.channel));
    }

    function sortItemsInList(items) {
      const arr = items.slice();
      if (STATE.view === "comms") {
        arr.sort((a,b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
      } else {
        arr.sort((a,b) => {
          const oa = STATUS_ORDER.indexOf(bucketKeyForStatus(a.status));
          const ob = STATUS_ORDER.indexOf(bucketKeyForStatus(b.status));
          if (oa !== ob) return oa - ob;
          return String(b.updated_at || "").localeCompare(String(a.updated_at || ""));
        });
      }
      return arr;
    }

    function buildMainList() {
      const proj = projectById(STATE.project);
      const mainMeta = document.getElementById("mainMeta");
      const bar = document.getElementById("filterBar");
      const list = document.getElementById("fileList");

      bar.innerHTML = "";
      list.innerHTML = "";

      if (STATE.panelMode === "conv") {
        if (mainMeta) {
          mainMeta.textContent = `view=项目对话 · scope=${(proj ? proj.name : STATE.project) || "-"} · generated_at=${DATA.generated_at}`;
        }
        return;
      }

      let items = scopeItems();
      items = sortItemsInList(items);

      const scopeLabel = (STATE.project === "overview")
        ? "总览（跨项目）"
        : `项目:${proj ? proj.name : STATE.project} · 通道:${STATE.channel || "-"}`;

      const viewLabel = (STATE.view === "comms") ? "沟通通道" : "工作任务";
      if (mainMeta) mainMeta.textContent = `view=${viewLabel} · scope=${scopeLabel} · generated_at=${DATA.generated_at} · items=${items.length}`;

      if (STATE.view === "work") {
        const typeRow = el("div", { class: "filterrow" });
        for (const t of typeOptions()) {
          typeRow.appendChild(chipButton(t === "全部" ? "全部" : t, STATE.type === t, () => {
            STATE.type = t;
            STATE.selectedPath = "";
            setHash();
            render();
          }));
        }

        const statusRow = el("div", { class: "filterrow" });
        for (const s of statusOptions()) {
          statusRow.appendChild(chipButton(s, STATE.status === s, () => {
            STATE.status = s;
            STATE.selectedPath = "";
            setHash();
            render();
          }));
        }

        bar.appendChild(typeRow);
        bar.appendChild(statusRow);
      } else {
        const info = el("div", { class: "filterrow" });
        info.appendChild(chip("仅加载：讨论空间", "muted"));
        info.appendChild(chip("排序：按更新时间倒序（最新在上）", "muted"));
        bar.appendChild(info);
      }

      if (!items.length) {
        list.appendChild(el("div", { class: "hint", text: "当前筛选条件下没有匹配的事项。" }));
        return;
      }

      for (const it of items.slice(0, 260)) {
        const p = String(it.path || "");
        const row = el("div", { class: "frow" + (p && p === String(STATE.selectedPath || "") ? " active" : ""), "data-path": p });
        row.appendChild(el("div", { class: "t", text: shortTitle(it.title) }));
        const m = el("div", { class: "m" });
        const b = bucketKeyForStatus(it.status);
        if (STATE.view === "work") {
          m.appendChild(chip(b, toneForBucket(b)));
          if (it.type) m.appendChild(chip(it.type, "muted"));
        } else {
          m.appendChild(chip("讨论", "muted"));
        }
        if (STATE.project === "overview") m.appendChild(chip(it.project_name || it.project_id, "muted"));
        if (it.channel) m.appendChild(chip(it.channel, "muted"));
        if (it.code) m.appendChild(chip(it.code, "muted"));
        if (it.owner) m.appendChild(chip("负责人:" + it.owner, "muted"));
        if (it.updated_at) m.appendChild(chip("更新:" + it.updated_at, "muted"));
        row.appendChild(m);
        row.appendChild(el("div", { class: "p", text: p }));
        row.addEventListener("click", () => setSelectedPath(it.path));
        list.appendChild(row);
      }
    }

    function renderDetail(it) {
      const titleEl = document.getElementById("detailTitle");
      const subEl = document.getElementById("detailSub");
      const metaEl = document.getElementById("detailMeta");
      const exEl = document.getElementById("detailExcerpt");
      const moreEl = document.getElementById("detailMore");
      const pathBar = document.getElementById("detailPathBar");
      const pathText = document.getElementById("detailPathText");
      const revealBtn = document.getElementById("detailRevealBtn");
      const convWrap = document.getElementById("convWrap");

      if (STATE.panelMode === "conv") {
        if (convWrap) convWrap.classList.add("show");
        renderConversationDetail();
        return;
      }
      if (convWrap) convWrap.classList.remove("show");
      if (subEl) subEl.textContent = "";

      metaEl.innerHTML = "";
      moreEl.innerHTML = "";

      const scopeProjectId = it ? String(it.project_id || "") : String(STATE.project || "");
      const scopeChannel = it ? String(it.channel || "") : String(STATE.channel || "");
      const scopeProject = (scopeProjectId && scopeProjectId !== "overview") ? projectById(scopeProjectId) : null;
      const sess = (scopeProjectId && scopeChannel && scopeProjectId !== "overview") ? sessionForChannel(scopeProjectId, scopeChannel) : null;
      const sid = sess && sess.session_id ? String(sess.session_id).trim() : "";
      const resumeCmd = sid ? (`codex resume ${sid}`) : "";

      // Path bar is bound to the selected item only (not just channel scope).
      if (pathBar) pathBar.style.display = "none";
      if (pathText) pathText.textContent = "";
      if (revealBtn) { revealBtn.disabled = true; revealBtn.onclick = () => {}; }

      if (!it) {
        titleEl.textContent = scopeChannel ? `未选择事项（${scopeChannel}）` : "未选择事项";
        if (subEl) subEl.textContent = "";
        setMarkdown(exEl, "", "(点击列表任意行，在此查看详情)");

        // 项目链接：做成顶部 chips，不占大面积
        if (scopeProject && Array.isArray(scopeProject.links) && scopeProject.links.length) {
          metaEl.appendChild(chip(scopeProject.name || scopeProject.id, "muted"));
          for (const lk of scopeProject.links.slice(0, 6)) {
            metaEl.appendChild(chipLink(lk.label || "链接", lk.url || ""));
          }
        }
        return;
      }

      titleEl.textContent = shortTitle(it.title);
      if (subEl) subEl.textContent = "";
      const b = bucketKeyForStatus(it.status);
      if (STATE.project === "overview") metaEl.appendChild(chip(it.project_name || it.project_id, "muted"));
      metaEl.appendChild(chip(it.channel || "未归类", "muted"));
      metaEl.appendChild(chip(b, toneForBucket(b)));
      if (it.type) metaEl.appendChild(chip(it.type, "muted"));
      if (it.code) metaEl.appendChild(chip(it.code, "muted"));
      if (it.owner) metaEl.appendChild(chip("负责人:" + it.owner, "muted"));
      if (it.due) metaEl.appendChild(chip("截止:" + it.due, "warn"));
      if (it.updated_at) metaEl.appendChild(chip("更新:" + it.updated_at, "muted"));
      if (scopeProject && Array.isArray(scopeProject.links) && scopeProject.links.length) {

        clearTimeout(CCB.pollTimer);
        CCB.pollTimer = 0;
      }
    }

    function scheduleCCBPoll(ms = 1500) {
      stopCCBPoll();
      CCB.pollTimer = setTimeout(() => {
        refreshCCB();
      }, ms);
    }

    function stopConversationPoll() {
      if (PCONV.pollTimer) {

        PCONV.pollTimer = 0;

    function scheduleConversationPoll(ms = 5000) {

    function ensureRunExpanded(runId) {
      const id = String(runId || "");
      if (!id) return;
      CCB.expanded.add(id);
      if (CCB.detailMap[id]) return;
      CCB.detailMap[id] = {
        loading: true,
        message: "",
        process: "",
        last: "",
        partial: "",
        errorHint: "",
        agentMessages: [],
        status: "",
        startedAt: "",
        finishedAt: "",
        runError: "",
        error: "",
      };
      loadRun(id).then((full) => {
        CCB.detailMap[id] = {
          loading: false,
          message: String((full && full.message) || ""),
          process: String((full && full.logTail) || ""),
          last: String((full && full.lastMessage) || ""),
          partial: String((full && full.partialMessage) || ""),
          errorHint: String((full && full.errorHint) || ""),
          agentMessages: Array.isArray(full && full.agentMessages) ? full.agentMessages : [],
          status: String((full && full.run && full.run.status) || ""),
          startedAt: String((full && full.run && full.run.startedAt) || ""),
          finishedAt: String((full && full.run && full.run.finishedAt) || ""),
          runError: String((full && full.run && full.run.error) || ""),
          error: "",
        };
        renderRuns(CCB.runs);
      }).catch((e) => {
        CCB.detailMap[id] = {
          loading: false,
          message: "",
          process: "",
          last: "",
          partial: "",
          errorHint: "",
          agentMessages: [],
          status: "",
          startedAt: "",
          finishedAt: "",
          runError: "",
          error: String(e || "load failed"),
        };
        renderRuns(CCB.runs);
      });
    }

    function collapseRun(runId) {
      const id = String(runId || "");
      if (!id) return;
      CCB.expanded.delete(id);
      renderRuns(CCB.runs);
    }

    async function apiHealth() {
      try {
        const r = await fetch("/__health", { cache: "no-store" });
        if (!r.ok) return false;
        const j = await r.json();
        return !!(j && j.ok);
      } catch (_) {
        return false;
      }
    }

    function currentChannelCtx(it) {
      const projectId = it ? String(it.project_id || "") : String(STATE.project || "");
      const channelName = it ? String(it.channel || "") : String(STATE.channel || "");
      const sess = (projectId && channelName && projectId !== "overview") ? sessionForChannel(projectId, channelName) : null;
      const sid = sess && sess.session_id ? String(sess.session_id).trim() : "";
      return { projectId, channelName, session: sess, sessionId: sid, channelId: projectId + "::" + channelName };
    }

    async function loadRuns(params = {}) {
      const qs = new URLSearchParams();
      qs.set("limit", String(params.limit || 30));
      if (params.channelId) qs.set("channelId", String(params.channelId));
      if (params.projectId) qs.set("projectId", String(params.projectId));
      if (params.sessionId) qs.set("sessionId", String(params.sessionId));
      const url = "/api/codex/runs?" + qs.toString();
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error("runs fetch failed");
      return await r.json();
    }

    async function loadRun(id) {
      const r = await fetch("/api/codex/run/" + encodeURIComponent(String(id || "")), { cache: "no-store" });
      if (!r.ok) throw new Error("run fetch failed");
      return await r.json();
    }

    function renderRuns(runs) {
      const box = document.getElementById("ccbRuns");
      CCB.runs = Array.isArray(runs) ? runs.slice() : [];
      box.innerHTML = "";
      if (!runs || !runs.length) {
        box.appendChild(el("div", { class: "hint", text: "暂无回溯记录（从这里发送一条消息开始）。" }));
        return;
      }
      for (const r of runs.slice(0, 20)) {
        const row = el("div", { class: "runrow" });
        const top = el("div", { class: "top" });
        top.appendChild(el("div", { class: "id", text: (r.createdAt || "") + " · " + (r.id || "") }));
        const st = String(r.status || "");
        top.appendChild(chip(st, st === "done" ? "good" : (st === "error" ? "bad" : "warn")));
        row.appendChild(top);
        const msg = String(r.messagePreview || "").trim();
        if (msg) row.appendChild(el("div", { class: "msg", text: "msg: " + msg }));
        const err = String(r.error || "").trim();
        if (st === "error") {
          row.appendChild(el("div", { class: "err", text: "error: " + (err || "执行失败（未返回具体错误文本）") }));
          const eh = String(r.errorHint || "").trim();
          if (eh) row.appendChild(el("div", { class: "hint", text: eh }));
        }
        const partial = String(r.partialPreview || "").trim();
        if (partial) {
          const pv = el("div", { class: "partial md" });
          setMarkdown(pv, partial);
          row.appendChild(pv);
        }
        const amCount = Number(r.agentMessagesCount || 0);
        if (amCount > 0) row.appendChild(el("div", { class: "hint", text: "已回捞过程消息 " + amCount + " 条" }));
        const last = String(r.lastPreview || "");
        if (last) {
          const lv = el("div", { class: "last reply" });
          setMarkdown(lv, last);
          row.appendChild(lv);
        }
        const log = String(r.logPreview || "").trim();
        if (log) {
          const stLabel = (st === "queued" || st === "running") ? "process" : "log";
          row.appendChild(el("div", { class: "last", text: stLabel + ":\n" + log }));
        } else if (st === "error") {
          row.appendChild(el("div", { class: "hint", text: "未采集到过程日志（可能是任务启动后进程提前退出，或该记录产生于旧版本服务）。" }));
        }
        const btns = el("div", { class: "chips", style: "justify-content:flex-end; gap:8px" });
        if (st === "error") {
          const recoverBtn = el("button", { class: "btn", text: "回收结果" });
          recoverBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            recoverBtn.disabled = true;
            try {
              await recoverRun(r);
            } finally {
              recoverBtn.disabled = false;
            }
          });
          btns.appendChild(recoverBtn);
          const retryBtn = el("button", { class: "btn", text: "重试" });
          retryBtn.addEventListener("click", async (e) => {
            e.stopPropagation();
            retryBtn.disabled = true;
            try {
              await retryRun(r);
            } finally {
              retryBtn.disabled = false;
            }
          });
          btns.appendChild(retryBtn);
        }
        const isExpanded = CCB.expanded.has(String(r.id || ""));
        const b = el("button", { class: "btn", text: isExpanded ? "收起" : "展开" });
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          const rid = String(r.id || "");
          if (!rid) return;
          if (CCB.expanded.has(rid)) collapseRun(rid);
          else ensureRunExpanded(rid);
        });
        btns.appendChild(b);
        row.appendChild(btns);

        if (isExpanded) {
          const d = CCB.detailMap[String(r.id || "")] || {
            loading: true,
            message: "",
            process: "",
            last: "",
            partial: "",
            errorHint: "",
            agentMessages: [],
            status: "",
            startedAt: "",
            finishedAt: "",
            runError: "",
            error: "",
          };
          if (d.loading) {
            row.appendChild(el("div", { class: "hint", text: "加载详细过程中…" }));
          } else if (d.error) {
            row.appendChild(el("div", { class: "hint", text: "加载失败: " + d.error }));
          } else {
            const metaText = "status: " + String(d.status || "") +
              (d.startedAt ? ("\nstarted: " + String(d.startedAt)) : "") +
              (d.finishedAt ? ("\nfinished: " + String(d.finishedAt)) : "");
            const errFull = String(d.runError || "").trim();
            const processText = String(d.process || "");
            let fullText = "meta:\n" + metaText + "\n\n";
            const eh = String(d.errorHint || "").trim();
            if (eh) fullText += "hint:\n" + eh + "\n\n";
            if (errFull) fullText += "error:\n" + errFull + "\n\n";
            const partialFull = String(d.partial || "").trim();
            if (partialFull) fullText += "partial:\n" + partialFull + "\n\n";
            const am = Array.isArray(d.agentMessages) ? d.agentMessages : [];
            if (am.length) fullText += "agent_messages:\n- " + am.join("\n- ") + "\n\n";
            fullText += "msg:\n" + String(d.message || "") + "\n\nprocess:\n" + processText + "\n\nlast:\n" + String(d.last || "");
            row.appendChild(el("div", { class: "last", text: fullText }));
          }
        }
        box.appendChild(row);
      }
    }

    function configuredProjectConversations(projectId) {
      const proj = projectById(projectId);
      // Use sessionForChannel so local bindings are also included.
      const names = unionChannelNames(projectId);
      const list = [];
      for (const n of names) {
        const s = sessionForChannel(projectId, n);
        if (s) list.push(s);
      }
      const map = new Map();
      for (const s of list) {
        const sid = String((s && s.session_id) || "").trim();
        if (!looksLikeSessionId(sid)) continue;
        const ch = String((s && s.name) || "").trim();
        const alias = String((s && s.alias) || "").trim();
        let it = map.get(sid);
        if (!it) {
          it = {
            sessionId: sid,
            alias: alias || ch || sid,
            channels: [],
            primaryChannel: ch || "",
            displayChannel: ch || alias || sid,
            lastActiveAt: "",
            lastStatus: "idle",
            lastPreview: "",
            lastSpeaker: "assistant",
            runCount: 0,
          };
          map.set(sid, it);
        }
        if (ch && !it.channels.includes(ch)) it.channels.push(ch);
        if (!it.primaryChannel && ch) it.primaryChannel = ch;
        if (!it.displayChannel && ch) it.displayChannel = ch;
        if (!it.alias && alias) it.alias = alias;
      }
      return Array.from(map.values());
    }
