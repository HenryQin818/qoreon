    function setSelectedSessionId(sessionId, forceScroll = false) {
      const sid = String(sessionId || "").trim();
      if (!sid) return;
      const changed = sid !== String(STATE.selectedSessionId || "");
      STATE.selectedSessionId = sid;
      try { localStorage.setItem("taskDashboard.selectedSessionId", STATE.selectedSessionId); } catch (_) {}
      buildConversationLeftList();
      renderConversationDetail(changed || forceScroll);
      if (STATE.panelMode === "conv" && STATE.project && STATE.project !== "overview") {
        refreshConversationTimeline(String(STATE.project || ""), sid, changed || forceScroll);
      }
      setHash();
    }

    function currentConversationCtx() {
      if (STATE.project === "overview") return null;
      const sid = String(STATE.selectedSessionId || "").trim();
      if (!sid) return null;
      const sessions = Array.isArray(PCONV.sessions) ? PCONV.sessions : [];
      const cur = sessions.find(x => String(x.sessionId || "") === sid) || null;
      if (!cur) return null;
      return {
        projectId: String(STATE.project || ""),
        sessionId: sid,
        channelName: String(cur.primaryChannel || ""),
        displayChannel: String(cur.displayChannel || cur.primaryChannel || cur.alias || ""),
        alias: String(cur.alias || ""),
      };
    }

    function maybeStickConversationBottom(force = false) {
      const box = document.getElementById("convTimeline");
      if (!box) return;
      const nearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 80;
      if (force || nearBottom) box.scrollTop = box.scrollHeight;
    }

    function ensureConversationRunDetail(runId) {
      const rid = String(runId || "");
      if (!rid) return;
      if (PCONV.detailMap[rid]) return;
      PCONV.detailMap[rid] = { loading: true, error: "" };
      loadRun(rid).then((full) => {
        PCONV.detailMap[rid] = {
          loading: false,
          full,
          error: "",
        };
        renderConversationDetail();
      }).catch((e) => {
        PCONV.detailMap[rid] = { loading: false, full: null, error: String(e || "load failed") };
        renderConversationDetail();
      });
    }

    function shouldFoldBubble(text) {
      const src = String(text || "");
      if (!src.trim()) return false;
      const lineCount = src.split(/\r\n?|\n/).length;
      return src.length > 360 || lineCount > 10;
    }

    function appendConversationBubble(row, role, content, fallback, bubbleKey, opts = {}) {
      const txt = String(content || "");
      const bubble = el("div", { class: "mbubble md" });
      setMarkdown(bubble, txt, fallback || "");
      const foldable = shouldFoldBubble(txt || fallback || "");
      const expanded = PCONV.bubbleExpanded.has(String(bubbleKey || ""));
      const runId = String(opts.runId || "");
      const isUserBubble = String(role || "") === "user";
      if (expanded && runId && !PCONV.detailMap[runId]) ensureConversationRunDetail(runId);
      if (foldable && !expanded) bubble.classList.add("collapsed");
      row.appendChild(bubble);
      if (!foldable) return;
      const btn = el("button", {
        class: "btn textbtn bubble-expand-toggle" + (isUserBubble ? " user-bubble-expand-toggle" : ""),
        text: expanded
          ? (isUserBubble ? "收起用户消息" : "收起正文")
          : (isUserBubble ? "查看全部用户消息" : "展开全文"),
        title: expanded
          ? (isUserBubble ? "收起当前用户消息" : "收起正文")
          : (isUserBubble ? "查看当前用户消息完整内容" : "展开全文"),
      });
      btn.addEventListener("click", () => {
        const key = String(bubbleKey || "");
        if (!key) return;
        if (PCONV.bubbleExpanded.has(key)) PCONV.bubbleExpanded.delete(key);
        else {
          PCONV.bubbleExpanded.add(key);
          if (runId) ensureConversationRunDetail(runId);
        }
        renderConversationDetail();
      });
      if (opts.opsContainer) {
        opts.opsContainer.appendChild(btn);
      } else {
        const ops = el("div", { class: "bubbleops " + (role === "user" ? "user" : "assistant") });
        ops.appendChild(btn);
        row.appendChild(ops);
      }
    }

    function renderConversationDetail(forceScroll = false) {
      const titleEl = document.getElementById("detailTitle");
      const subEl = document.getElementById("detailSub");
      const hintEl = document.getElementById("convHint");
      const timeline = document.getElementById("convTimeline");
      const input = document.getElementById("convMsg");
      const sendBtn = document.getElementById("convSendBtn");
      const pathBar = document.getElementById("detailPathBar");
      const basePlaceholder = "输入要发给该会话 Codex 的消息（Enter 发送）";
      if (pathBar) pathBar.style.display = "none";
      if (!titleEl || !timeline || !input || !sendBtn || !hintEl || !subEl) return;

      const wasNearBottom = (timeline.scrollHeight - timeline.scrollTop - timeline.clientHeight) < 80;

      timeline.innerHTML = "";
      if (STATE.project === "overview") {
        titleEl.textContent = "项目对话";
        subEl.textContent = "";
        hintEl.textContent = "";
        input.placeholder = "请先选择具体项目，再发送会话消息";
        input.disabled = true;
        sendBtn.disabled = true;
        timeline.appendChild(el("div", { class: "hint", text: "总揽模式不展示会话详情。" }));
        return;
      }

      const ctx = currentConversationCtx();
      if (!ctx) {
        titleEl.textContent = "项目对话";
        subEl.textContent = "";
        hintEl.textContent = "";
        input.placeholder = "当前项目没有可用会话，请先维护 session_id";
        input.disabled = true;
        sendBtn.disabled = true;
        timeline.appendChild(el("div", { class: "hint", text: "无可用会话。" }));
        return;
      }

      titleEl.textContent = String(ctx.displayChannel || ctx.channelName || ctx.alias || "会话") + " · " + String(ctx.sessionId || "");
      subEl.textContent = "";
      hintEl.textContent = "";
      input.placeholder = basePlaceholder;
      input.disabled = false;
      sendBtn.disabled = PCONV.sending;
      sendBtn.textContent = PCONV.sending ? "发送中..." : "发送";

      const timelineKey = String(STATE.project || "") + "::" + String(ctx.sessionId || "");
      const runSource = Array.isArray(PCONV.sessionTimelineMap[timelineKey])
        ? PCONV.sessionTimelineMap[timelineKey]
        : (PCONV.runsBySession[ctx.sessionId] || []);
      const runs = runSource.slice().sort((a, b) => {
        const ta = toTimeNum(a.createdAt);
        const tb = toTimeNum(b.createdAt);
        if (ta >= 0 && tb >= 0 && ta !== tb) return ta - tb;
        return String(a.createdAt || "").localeCompare(String(b.createdAt || ""));
      });
      const timelineLoading = PCONV.timelineLoadingKey === timelineKey;

      if (!runs.length && !(PCONV.optimistic && PCONV.optimistic.sessionId === ctx.sessionId)) {
        timeline.appendChild(el("div", { class: "hint", text: timelineLoading ? "加载会话记录中..." : "该会话暂无消息记录，可直接在下方发送消息。" }));
      }

      for (const r of runs) {
        const rid = String(r.id || "");
        const st = String(r.status || "");
        const d = PCONV.detailMap[rid] || null;
        const userText = (d && d.full && d.full.message) ? String(d.full.message) : String(r.messagePreview || "");
        const assistantText = (d && d.full && d.full.lastMessage) ? String(d.full.lastMessage) : String(r.lastPreview || r.partialPreview || "");
        const err = String(r.error || "").trim();
        const hint = String(r.errorHint || "").trim();

        const userRow = el("div", { class: "msgrow user" });
        const userMeta = el("div", { class: "msgmeta" });
        userMeta.appendChild(chip("我", "muted"));
        if (r.createdAt) userMeta.appendChild(el("span", { text: imTime(r.createdAt) }));
        userRow.appendChild(userMeta);
        appendConversationBubble(userRow, "user", userText || "", "(空消息)", rid + ":user");
        timeline.appendChild(userRow);

        const aiRow = el("div", { class: "msgrow assistant" });
        const aiMeta = el("div", { class: "msgmeta" });
        aiMeta.appendChild(chip("Codex", "muted"));
        aiMeta.appendChild(statusChip(st || "idle"));
        if (r.createdAt) aiMeta.appendChild(el("span", { text: imTime(r.createdAt) }));
        if (st === "running" || st === "queued") aiMeta.appendChild(el("span", { class: "dotspin" }));
        aiRow.appendChild(aiMeta);
        const ops = el("div", { class: "chips", style: "justify-content:flex-start; gap:8px" });
        appendConversationBubble(
          aiRow,
          "assistant",
          assistantText || "",
          ((st === "running" || st === "queued") ? "处理中..." : "(暂无回复)"),
          rid + ":assistant",
          { opsContainer: ops, runId: rid }
        );
        if (st === "error") {
          aiRow.appendChild(el("div", { class: "merr", text: "error: " + (err || "执行失败（未返回具体错误文本）") }));
          if (hint) aiRow.appendChild(el("div", { class: "hint", text: hint }));
        }
        if (st === "error") {
          const recoverBtn = el("button", { class: "btn", text: "回收结果" });
          recoverBtn.addEventListener("click", async () => {
            recoverBtn.disabled = true;
            try { await recoverRun(r); } finally { recoverBtn.disabled = false; }
          });
          ops.appendChild(recoverBtn);
          const retryBtn = el("button", { class: "btn", text: "重试" });
          retryBtn.addEventListener("click", async () => {
            retryBtn.disabled = true;
            try { await retryRun(r); } finally { retryBtn.disabled = false; }
          });
          ops.appendChild(retryBtn);
        }
        const expanded = PCONV.debugExpanded.has(rid);
        const dbgBtn = el("button", { class: "btn textbtn", text: expanded ? "收起调试" : "展开调试" });
        dbgBtn.addEventListener("click", () => {
          if (expanded) {
            PCONV.debugExpanded.delete(rid);
            renderConversationDetail();
          } else {
            PCONV.debugExpanded.add(rid);
            ensureConversationRunDetail(rid);
            renderConversationDetail();
          }
        });
        ops.appendChild(dbgBtn);
        if (ops.childNodes.length) aiRow.appendChild(ops);

        if (expanded) {
          if (!d || d.loading) {
            aiRow.appendChild(el("div", { class: "hint", text: "加载调试日志中..." }));
          } else if (d.error) {
            aiRow.appendChild(el("div", { class: "hint", text: "调试日志加载失败: " + d.error }));
          } else if (d.full) {
            const f = d.full;
            const run = f.run || {};
            const log = String(f.logTail || "").trim();
            const txt = [
              "status: " + String(run.status || ""),
              run.startedAt ? ("started: " + String(run.startedAt)) : "",
              run.finishedAt ? ("finished: " + String(run.finishedAt)) : "",
              String(run.error || "").trim() ? ("error: " + String(run.error || "").trim()) : "",
              "",
              "log:",
              log || "(empty)",
            ].filter(Boolean).join("\n");
            aiRow.appendChild(el("div", { class: "mdebug", text: txt }));
          }
        }
        timeline.appendChild(aiRow);
      }

      if (PCONV.optimistic && PCONV.optimistic.sessionId === ctx.sessionId) {
        const m = PCONV.optimistic;
        const userRow = el("div", { class: "msgrow user" });
        const userMeta = el("div", { class: "msgmeta" });
        userMeta.appendChild(chip("我", "muted"));
        userMeta.appendChild(el("span", { text: imTime(m.createdAt || "") }));
        userRow.appendChild(userMeta);
        appendConversationBubble(userRow, "user", m.message || "", "", "optimistic:user");
        timeline.appendChild(userRow);

        const aiRow = el("div", { class: "msgrow assistant" });
        const aiMeta = el("div", { class: "msgmeta" });
        aiMeta.appendChild(chip("Codex", "muted"));
        aiMeta.appendChild(chip("running", "warn"));
        aiMeta.appendChild(el("span", { class: "dotspin" }));
        aiRow.appendChild(aiMeta);
        appendConversationBubble(aiRow, "assistant", "处理中...", "", "optimistic:assistant");
        timeline.appendChild(aiRow);
      }

      maybeStickConversationBottom(forceScroll || wasNearBottom);
    }

    async function refreshConversationTimeline(projectId, sessionId, forceScroll = false) {
      const pid = String(projectId || "").trim();
      const sid = String(sessionId || "").trim();
      if (!pid || !sid || pid === "overview") return;
      const key = pid + "::" + sid;
      const shouldForce = forceScroll || !Array.isArray(PCONV.sessionTimelineMap[key]);
      const seq = ++PCONV.timelineRequestSeq;
      PCONV.timelineLoadingKey = key;
      renderConversationDetail(shouldForce);
      try {
        const resp = await loadRuns({ projectId: pid, sessionId: sid, limit: 100 });
        if (seq !== PCONV.timelineRequestSeq) return;
        PCONV.sessionTimelineMap[key] = Array.isArray(resp && resp.runs) ? resp.runs : [];
      } catch (_) {
        if (seq !== PCONV.timelineRequestSeq) return;
        // Keep fallback timeline from project-level grouping.
      } finally {
        if (seq === PCONV.timelineRequestSeq) PCONV.timelineLoadingKey = "";
        renderConversationDetail(shouldForce);
      }
    }

    async function refreshConversationPanel() {
      if (STATE.panelMode !== "conv") return;
      if (PCONV.busy) return;
      const projectId = String(STATE.project || "");
      if (!projectId || projectId === "overview") {
        stopConversationPoll();
        PCONV.sessions = [];
        PCONV.projectRuns = [];
        PCONV.runsBySession = Object.create(null);
        PCONV.sessionTimelineMap = Object.create(null);
        PCONV.bubbleExpanded = new Set();
        PCONV.timelineRequestSeq = 0;
        PCONV.timelineLoadingKey = "";
        buildConversationLeftList();
        renderConversationDetail(true);
        return;
      }

      if (PCONV.lastProjectId !== projectId) {
        PCONV.lastProjectId = projectId;
        PCONV.detailMap = Object.create(null);
        PCONV.debugExpanded = new Set();
        PCONV.bubbleExpanded = new Set();
        PCONV.sessionTimelineMap = Object.create(null);
        PCONV.timelineRequestSeq = 0;
        PCONV.timelineLoadingKey = "";
      }

      PCONV.busy = true;
      try {
        const baseSessions = configuredProjectConversations(projectId);
        const runResp = await loadRuns({ projectId, limit: 200 });
        const allRuns = Array.isArray(runResp && runResp.runs) ? runResp.runs : [];
        PCONV.projectRuns = allRuns.slice();

        const grouped = Object.create(null);
        for (const r of allRuns) {
          const sid = String((r && r.sessionId) || "").trim();
          if (!sid) continue;
          if (!grouped[sid]) grouped[sid] = [];
          grouped[sid].push(r);
        }
        PCONV.runsBySession = grouped;

        for (const s of baseSessions) {
          const runs = (grouped[s.sessionId] || []).slice().sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
          s.runCount = runs.length;
          const top = runs[0] || null;
          s.lastActiveAt = top ? String(top.createdAt || "") : "";
          s.lastStatus = top ? String(top.status || "idle") : "idle";
          const aiPreview = top ? String(top.lastPreview || top.partialPreview || "") : "";
          const userPreview = top ? String(top.messagePreview || "") : "";
          s.lastSpeaker = aiPreview ? "assistant" : (userPreview ? "user" : "assistant");
          s.lastPreview = aiPreview || userPreview || "";
          if (top && top.channelName && !isQoreonV2Project(projectId)) {
            s.primaryChannel = String(top.channelName || s.primaryChannel || "");
            s.displayChannel = String(top.channelName || s.displayChannel || s.primaryChannel || "");
          }
          if (!s.primaryChannel) s.primaryChannel = (s.channels && s.channels[0]) ? String(s.channels[0]) : "";
          if (!s.displayChannel) s.displayChannel = s.primaryChannel || s.alias || s.sessionId;
        }

        const q = String(STATE.q || "").trim().toLowerCase();
        let sessions = baseSessions.slice();
        if (q) {
          sessions = sessions.filter((s) => {
            const hay = [
              s.alias,
              s.sessionId,
              (s.channels || []).join(" "),
              s.lastPreview || "",
            ].join(" ").toLowerCase();
            return hay.includes(q);
          });
        }
        sessions.sort((a, b) => {
          const ta = String(a.lastActiveAt || "");
          const tb = String(b.lastActiveAt || "");
          if (ta !== tb) return tb.localeCompare(ta);
          return String(a.alias || "").localeCompare(String(b.alias || ""), "zh-Hans-CN");
        });
        PCONV.sessions = sessions;
        PCONV.lastRefreshAt = new Date().toLocaleTimeString("zh-CN", { hour12: false });

        if (sessions.length) {
          const ok = sessions.some(x => String(x.sessionId || "") === String(STATE.selectedSessionId || ""));
          if (!ok) STATE.selectedSessionId = String(sessions[0].sessionId || "");
        } else {
          STATE.selectedSessionId = "";
        }

        buildConversationLeftList();
        renderConversationDetail(!STATE.selectedSessionId);
        if (STATE.selectedSessionId) {
          refreshConversationTimeline(projectId, STATE.selectedSessionId, !STATE.selectedSessionId);
        }

        const hasRunning = allRuns.some(x => {
          const s = String((x && x.status) || "");
          return s === "queued" || s === "running";
        });
        if (hasRunning || PCONV.sending) scheduleConversationPoll(5000);
        else stopConversationPoll();
      } catch (_) {
        stopConversationPoll();
      } finally {
        PCONV.busy = false;
      }
    }

    async function sendConversationMessage() {
      const input = document.getElementById("convMsg");
      const sendBtn = document.getElementById("convSendBtn");
      const hint = document.getElementById("convHint");
      if (!input || !sendBtn || !hint) return;
      const ctx = currentConversationCtx();
      if (!ctx || !ctx.sessionId || !ctx.channelName) {
        input.placeholder = "该会话缺少通道路由，请先为该 session 绑定通道";
        return;
      }
      const message = String(input.value || "").trim();
      if (!message) return;

      PCONV.sending = true;
      PCONV.optimistic = {
        sessionId: ctx.sessionId,
        message,
        createdAt: new Date().toISOString(),
      };
      sendBtn.disabled = true;
      sendBtn.textContent = "发送中...";
      renderConversationDetail(true);

      try {
        const r = await fetch("/api/codex/announce", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            projectId: ctx.projectId,
            channelName: ctx.channelName,
            sessionId: ctx.sessionId,
            message,
          }),
        });
        if (r.ok) {
          input.value = "";
          const resp = await r.json();
          const runId = resp && resp.run ? String(resp.run.id || "") : "";
          PCONV.optimistic = null;
          PCONV.sending = false;
          await refreshConversationPanel();
        if (runId) scheduleConversationPoll(5000);
        return;
      }
        input.placeholder = "发送失败：服务暂未返回成功状态";
      } catch (_) {
        input.placeholder = "发送失败：网络或服务异常，请重试";
      }
      PCONV.sending = false;
      PCONV.optimistic = null;
      sendBtn.disabled = false;
      sendBtn.textContent = "发送";
      renderConversationDetail();
    }

    async function refreshCCB() {
      if (STATE.panelMode === "conv") return;
      if (CCB.busy) return;
      const hint = document.getElementById("ccbHint");
      const sendBtn = document.getElementById("ccbSendBtn");
      const refreshBtn = document.getElementById("ccbRefreshBtn");
      const sidChip = document.getElementById("ccbSidChip");
      const copySidBtn = document.getElementById("ccbCopySidBtn");
      const bindBtn = document.getElementById("ccbBindBtn");
      const editBtn = document.getElementById("ccbEditBindBtn");
      const unbindBtn = document.getElementById("ccbUnbindBtn");
      if (!hint || !sendBtn || !refreshBtn) return;

      const it = selectedItem();
      const ctx = currentChannelCtx(it);
      const channelId = ctx.channelId;
      if (CCB.lastChannelId !== channelId) {
        CCB.lastChannelId = channelId;
        CCB.expanded = new Set();
        CCB.detailMap = Object.create(null);
        CCB.runs = [];
      }
      if (sidChip) {
        sidChip.style.display = ctx.sessionId ? "" : "none";
        if (ctx.sessionId) sidChip.textContent = "session_id:" + shortId(ctx.sessionId);
      }
      if (copySidBtn) {
        copySidBtn.style.display = ctx.sessionId ? "" : "none";
        copySidBtn.onclick = ctx.sessionId ? (() => copyText(ctx.sessionId)) : (() => {});
      }
      if (bindBtn) {
        bindBtn.style.display = ctx.sessionId ? "none" : "";
        bindBtn.onclick = (!ctx.sessionId && ctx.projectId && ctx.channelName && ctx.projectId !== "overview")
          ? (() => openBindModal(ctx.projectId, ctx.channelName))
          : (() => {});
      }
      if (editBtn) {
        editBtn.style.display = ctx.sessionId ? "" : "none";
        editBtn.onclick = (ctx.projectId && ctx.channelName && ctx.projectId !== "overview")
          ? (() => openBindModal(ctx.projectId, ctx.channelName))
          : (() => {});
      }
      if (unbindBtn) {
        const hasLocal = !!getBinding(ctx.projectId, ctx.channelName);
        unbindBtn.style.display = (ctx.sessionId && hasLocal) ? "" : "none";
        unbindBtn.onclick = (ctx.projectId && ctx.channelName && ctx.projectId !== "overview")
          ? (() => { clearBinding(ctx.projectId, ctx.channelName); render(); })
          : (() => {});
      }
      if (!channelId || channelId.includes("overview::")) {
        stopCCBPoll();
        hint.textContent = "CCB：请进入具体项目并选择通道后使用。";
        sendBtn.disabled = true;
        refreshBtn.disabled = true;
        renderRuns([]);
        return;
      }

      CCB.busy = true;
      try {
        const ok = await apiHealth();
        if (!ok) {
          stopCCBPoll();
          hint.textContent = "CCB API 未启用：请用 run_local.sh 启动看板服务（需要同源 API 才能发消息/回看回复）。";
          sendBtn.disabled = true;
          refreshBtn.disabled = true;
          renderRuns([]);
          return;
        }

        refreshBtn.disabled = false;
        if (!ctx.sessionId) {
          stopCCBPoll();
          hint.textContent = "该通道未绑定 session_id：点击右上角【绑定对话】填写 Codex session_id（保存在本机浏览器）后即可发送。";
          sendBtn.disabled = true;
          renderRuns([]);
          return;
        }

        hint.textContent = "发送后会调用 `codex exec resume <sessionId>`，并在回溯列表实时显示处理过程和最后回复。";
        sendBtn.disabled = false;

        const j = await loadRuns({ channelId, limit: 30 });
        const runs = (j && j.runs) ? j.runs : [];
        renderRuns(runs);
        const hasRunning = runs.some(x => {
          const s = String((x && x.status) || "");
          return s === "queued" || s === "running";
        });
        if (hasRunning) {
          hint.textContent = "Codex 正在处理该通道消息，日志会自动刷新。";
          scheduleCCBPoll(5000);
        } else {
          stopCCBPoll();
        }
      } finally {
        CCB.busy = false;
      }
    }

    async function sendCCB() {
      if (STATE.panelMode === "conv") return;
      const it = selectedItem();
      const ctx = currentChannelCtx(it);
      const msgEl = document.getElementById("ccbMsg");
      const sendBtn = document.getElementById("ccbSendBtn");
      const refreshBtn = document.getElementById("ccbRefreshBtn");
      if (!msgEl || !sendBtn || !refreshBtn) return;

      const message = String(msgEl.value || "").trim();
      if (!message) return;
      if (!ctx.sessionId) return;

      sendBtn.disabled = true;
      refreshBtn.disabled = true;
      try {
        const r = await fetch("/api/codex/announce", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            projectId: ctx.projectId,
            channelName: ctx.channelName,
            sessionId: ctx.sessionId,
            message,
          }),
        });
        if (r.ok) {
          const resp = await r.json();
          const runId = resp && resp.run ? String(resp.run.id || "") : "";
          msgEl.value = "";
          await refreshCCB();
          if (runId) scheduleCCBPoll(5000);
        }
      } catch (_) {}
      sendBtn.disabled = false;
      refreshBtn.disabled = false;
      await refreshCCB();
    }

    async function retryRun(runMeta) {
      const rid = String((runMeta && runMeta.id) || "").trim();
      if (!rid) return;
      const full = await loadRun(rid);
      const run = (full && full.run) ? full.run : {};
      const message = String((full && full.message) || "").trim();
      const projectId = String(run.projectId || runMeta.projectId || "").trim();
      const channelName = String(run.channelName || runMeta.channelName || "").trim();
      const sessionId = String(run.sessionId || runMeta.sessionId || "").trim();
      if (!projectId || !channelName || !sessionId || !message) return;

      const r = await fetch("/api/codex/announce", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ projectId, channelName, sessionId, message }),
      });
      if (!r.ok) return;
      const resp = await r.json();
      const runId = resp && resp.run ? String(resp.run.id || "") : "";
      if (STATE.panelMode === "conv") {
        await refreshConversationPanel();
        if (runId) scheduleConversationPoll(5000);
      } else {
        await refreshCCB();
        if (runId) scheduleCCBPoll(5000);
      }
    }

    async function recoverRun(runMeta) {
      const rid = String((runMeta && runMeta.id) || "").trim();
      if (!rid) return;
      const full = await loadRun(rid);
      const run = (full && full.run) ? full.run : {};
      const original = String((full && full.message) || "").trim();
      const partial = String((full && full.partialMessage) || "").trim();
      const err = String((run && run.error) || (runMeta && runMeta.error) || "").trim();
      const hint = String((full && full.errorHint) || "").trim();
      const projectId = String(run.projectId || runMeta.projectId || "").trim();
      const channelName = String(run.channelName || runMeta.channelName || "").trim();
      const sessionId = String(run.sessionId || runMeta.sessionId || "").trim();
      if (!projectId || !channelName || !sessionId || !original) return;

      let recoveryMsg = "";
      recoveryMsg += "上一次执行已发生超时/中断，请做结果回收。\n";
      recoveryMsg += "要求：不要整段重跑耗时浏览器流程，优先基于已完成步骤做最终收口；如确需补测，仅补最小必要步骤后直接给最终结论。\n";
      recoveryMsg += "输出：\n";
      recoveryMsg += "1) 本次已完成事实（按步骤）\n";
      recoveryMsg += "2) 最终结论/判断\n";
      recoveryMsg += "3) 风险与待补项（如有）\n";
      recoveryMsg += "4) 下一步可执行动作（最多3条）\n";
      recoveryMsg += "\n原始消息：\n" + original + "\n";
      if (err) recoveryMsg += "\n错误信息：\n" + err + "\n";
      if (hint) recoveryMsg += "\n错误提示：\n" + hint + "\n";
      if (partial) recoveryMsg += "\n已回捞片段：\n" + partial + "\n";

      const r = await fetch("/api/codex/announce", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ projectId, channelName, sessionId, message: recoveryMsg }),
      });
      if (!r.ok) return;
      const resp = await r.json();
      const runId = resp && resp.run ? String(resp.run.id || "") : "";
      if (STATE.panelMode === "conv") {
        await refreshConversationPanel();
        if (runId) scheduleConversationPoll(5000);
      } else {
        await refreshCCB();
        if (runId) scheduleCCBPoll(5000);
      }
    }

    function cycleLayout() {
      const cur = STATE.layout;
      STATE.layout = (cur === "auto") ? "right" : (cur === "right") ? "bottom" : "auto";
      try { localStorage.setItem("taskDashboard.layout", STATE.layout); } catch (_) {}
      setHash();
      applyLayout();
    }

    function setPanelMode(nextMode) {
      const mode = (nextMode === "conv") ? "conv" : "ops";
      if (STATE.panelMode === mode) return;
      STATE.panelMode = mode;
      try { localStorage.setItem("taskDashboard.panelMode", STATE.panelMode); } catch (_) {}
      if (STATE.panelMode === "conv") {
        stopCCBPoll();
      } else {
        stopConversationPoll();
      }
      setHash();
      render();
    }

    function wire() {
      const qEl = document.getElementById("q");
      qEl.addEventListener("input", (e) => {
        STATE.q = e.target.value || "";
        if (STATE.panelMode !== "conv") STATE.selectedPath = "";
        setHash();
        render();
      });
      const opsBtn = document.getElementById("panelOpsBtn");
      const convBtn = document.getElementById("panelConvBtn");
      if (opsBtn) opsBtn.addEventListener("click", () => setPanelMode("ops"));
      if (convBtn) convBtn.addEventListener("click", () => setPanelMode("conv"));
      document.getElementById("layoutBtn").addEventListener("click", cycleLayout);
      document.getElementById("tabWork").addEventListener("click", () => {
        STATE.view = "work";
        STATE.selectedPath = "";
        try { localStorage.setItem("taskDashboard.view", STATE.view); } catch (_) {}
        setHash();
        render();
      });
      document.getElementById("tabComms").addEventListener("click", () => {
        STATE.view = "comms";
        STATE.selectedPath = "";
        try { localStorage.setItem("taskDashboard.view", STATE.view); } catch (_) {}
        setHash();
        render();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setSelectedPath("");
      });

      const rb = document.getElementById("ccbRefreshBtn");
      const sb = document.getElementById("ccbSendBtn");
      if (rb) rb.addEventListener("click", (e) => { e.preventDefault(); refreshCCB(); });
      if (sb) sb.addEventListener("click", (e) => { e.preventDefault(); sendCCB(); });
      const csb = document.getElementById("convSendBtn");
      if (csb) csb.addEventListener("click", (e) => { e.preventDefault(); sendConversationMessage(); });
      const cmsg = document.getElementById("convMsg");
      if (cmsg) cmsg.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendConversationMessage();
        }
      });

      // Bind modal wiring
      const bmask = document.getElementById("bindMask");
      const bcancel = document.getElementById("bindCancelBtn");
      const bsave = document.getElementById("bindSaveBtn");
      const bcreate = document.getElementById("bindCreateBtn");
      const bsid = document.getElementById("bindSid");
      if (bmask) bmask.addEventListener("click", (e) => {
        // click mask to close, but ignore clicks inside modal
        if (e.target === bmask) closeBindModal();
      });
      if (bcancel) bcancel.addEventListener("click", (e) => { e.preventDefault(); closeBindModal(); });
      async function commitBind() {
        const pid = String(BIND_UI.projectId || "");
        const ch = String(BIND_UI.channelName || "");
        const sid = String((bsid && bsid.value) || "").trim();
        if (!looksLikeSessionId(sid)) {
          bindModalError("session_id 格式不正确（需要 UUID 格式）。");
          return;
        }
        bindModalError("");
        setBinding(pid, ch, sid);
        closeBindModal();
        render();
      }
      if (bsave) bsave.addEventListener("click", (e) => { e.preventDefault(); commitBind(); });
      if (bcreate) bcreate.addEventListener("click", async (e) => {
        e.preventDefault();
        const pid = String(BIND_UI.projectId || "");
        const ch = String(BIND_UI.channelName || "");
        if (!pid || !ch || pid === "overview") return;
        const oldText = bcreate.textContent;
        bcreate.disabled = true;
        bcreate.textContent = "创建中...";
        bindModalError("");
        try {
          const r = await fetch("/api/codex/session/new", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ projectId: pid, channelName: ch }),
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) {
            const detail = j && (j.detail || j.error || j.message);
            bindModalError("创建失败：" + String(detail || "unknown"));
            return;
          }
          const sid = String((j && j.sessionId) || "").trim();
          if (!looksLikeSessionId(sid)) {
            bindModalError("创建失败：未拿到有效 session_id");
            return;
          }
          if (bsid) bsid.value = sid;
        } catch (err) {
          bindModalError("创建失败：网络或服务异常");
        } finally {
          bcreate.disabled = false;
          bcreate.textContent = oldText || "创建新对话";
        }
      });
      if (bsid) bsid.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); commitBind(); }
        if (e.key === "Escape") { e.preventDefault(); closeBindModal(); }
      });

      // Keep native scrolling behavior for the right panel.
    }

    function parseHash() {
      const h = String(location.hash || "").replace(/^#/, "");
      const params = new URLSearchParams(h || "");
      const p = params.get("p");
      const c = params.get("c");
      const q = params.get("q");
      const t = params.get("t");
      const s = params.get("s");
      const vm = params.get("vm");
      const pm = params.get("pm");
      const l = params.get("l");
      if (p && pages().some(x => x.id === p)) STATE.project = p;
      if (q !== null) STATE.q = q;
      if (t) STATE.type = t;
      if (s) STATE.status = s;
      if (vm === "c") STATE.view = "comms";
      if (vm === "w") STATE.view = "work";
      if (pm === "c") STATE.panelMode = "conv";
      if (pm === "o") STATE.panelMode = "ops";
      if (l === "r") STATE.layout = "right";
      if (l === "b") STATE.layout = "bottom";
      if (!STATE.project || !pages().some(x => x.id === STATE.project)) {
        const ps = pages();
        STATE.project = ps.length ? String(ps[0].id || "") : "";
      }
      ensureChannel();
      if (STATE.project !== "overview") {
        const names = unionChannelNames(STATE.project);
        if (c) {
          const legacyMap = {
            "子级01-Agent编排": "子级01-智能体系统-Agent编排",
            "子级02-场景编排": "子级02-智能体系统-场景编排",
            "子级03-任务蓝图": "子级03-智能体系统-任务蓝图",
            "子级04-模型与安全": "子级04-智能体系统-模型与安全",
            "子级05-验证与指标": "子级05-智能体系统-验证与指标",
            "子级06-客户沟通训练": "子级06-智能体系统-客户沟通训练"
          };
          const mapped = legacyMap[c] || c;
          if (names.includes(mapped)) STATE.channel = mapped;
        }
      }
    }

    function setHash() {
      try {
        const params = new URLSearchParams();
        params.set("p", STATE.project);
        if (STATE.channel) params.set("c", STATE.channel);
        if (STATE.q) params.set("q", STATE.q);
        if (STATE.type && STATE.type !== "全部") params.set("t", STATE.type);
        if (STATE.status && STATE.status !== "待办") params.set("s", STATE.status);
        if (STATE.view === "comms") params.set("vm", "c");
        if (STATE.panelMode === "conv") params.set("pm", "c");
        if (STATE.layout === "right") params.set("l", "r");
        if (STATE.layout === "bottom") params.set("l", "b");
        const s = params.toString();
        history.replaceState(null, "", s ? ("#" + s) : "#");
      } catch (_) {}
    }

    function applyViewTabs() {
      const w = document.getElementById("tabWork");
      const c = document.getElementById("tabComms");
      if (w) w.classList.toggle("active", STATE.view === "work");
      if (c) c.classList.toggle("active", STATE.view === "comms");
    }

    function render() {
      const qEl = document.getElementById("q");
      if (document.activeElement !== qEl) qEl.value = STATE.q;

      ensureChannel();
      buildTabs();
      buildLeftList();
      buildMainList();
      applyPanelMode();

      if (STATE.panelMode === "conv") {
        stopCCBPoll();
        renderDetail(null);
        refreshConversationPanel();
      } else {
        stopConversationPoll();
        ensureSelection();
        renderDetail(selectedItem());
        refreshCCB();
        updateSelectionUI();
      }
      applyLayout();
      applyViewTabs();
    }

    (function bootstrap() {
      try {
        const lay = localStorage.getItem("taskDashboard.layout");
        if (lay === "right" || lay === "bottom" || lay === "auto") STATE.layout = lay;
        const vm = localStorage.getItem("taskDashboard.view");
        if (vm === "work" || vm === "comms") STATE.view = vm;
        const pm = localStorage.getItem("taskDashboard.panelMode");
        if (pm === "ops" || pm === "conv") STATE.panelMode = pm;
        const sp = localStorage.getItem("taskDashboard.selectedPath");
        if (sp) STATE.selectedPath = sp;
        const ss = localStorage.getItem("taskDashboard.selectedSessionId");
        if (ss) STATE.selectedSessionId = ss;
      } catch (_) {}
      parseHash();
      wire();
      render();
    })();
  </script>

  <script>
    // Ambient blobs (low-energy). No-op when user prefers reduced motion.
    (function () {
      const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduceMotion) return;

      class Blob {
        constructor(el, index) {
          this.el = el;
          const w = window.innerWidth;
          const h = window.innerHeight;
          this.x = (index % 3) * (w / 3) - (w * 0.15);
          this.y = (Math.floor(index / 3) % 3) * (h / 3) - (h * 0.15);
          this.vx = (Math.random() - 0.5) * 0.08;
          this.vy = (Math.random() - 0.5) * 0.08;
          this.z = 0.9 + Math.random() * 0.2;
          this.vz = (Math.random() - 0.5) * 0.0005;
          this.bounds = () => {
            const ww = window.innerWidth;
            const hh = window.innerHeight;
            return { minX: -ww * 0.3, maxX: ww * 1.0, minY: -hh * 0.3, maxY: hh * 1.0 };
          };
        }
        update() {
          this.x += this.vx; this.y += this.vy; this.z += this.vz;
          const b = this.bounds();
          if (this.x < b.minX || this.x > b.maxX) this.vx *= -1;
          if (this.y < b.minY || this.y > b.maxY) this.vy *= -1;
          if (this.z < 0.8) this.vz += 0.001;
          if (this.z > 1.2) this.vz -= 0.001;
          this.render();
        }
        render() {
          let blur = 0;
          let opacity = 0.8;
          if (this.z > 1.1) {
            const t = (this.z - 1.1) / 0.1;
            blur = Math.max(0, 5 * (1 - t));
            opacity = 0.9 + t * 0.1;
          } else {
            const t = (1.1 - this.z) / 0.3;
            blur = 5 + t * 15;
            opacity = 0.9 - t * 0.3;
          }
          blur = Math.min(20, Math.max(0, blur));
          opacity = Math.min(1, Math.max(0.4, opacity));
          this.el.style.transform = `translate3d(${this.x}px, ${this.y}px, 0) scale(1)`;
          this.el.style.filter = `blur(${blur}px)`;
          this.el.style.opacity = String(opacity);
        }
      }

      const blobs = Array.from(document.querySelectorAll(".blob")).map((el, i) => new Blob(el, i));
      function animate() {
        blobs.forEach((b) => b.update());
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
